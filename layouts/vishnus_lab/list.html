{{ define "main" }}
<div class="lab-container" style="max-width: 800px; margin: 0 auto; padding: 2rem 1rem;">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    
    {{ if .Pages }}
    <h2>Projects</h2>
    <ul class="blog-posts">
        {{ range .Pages }}
        <li>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
        </li>
        {{ end }}
    </ul>
    {{ end }}
</div>
{{ end }}
